name: QtAVCore supported targets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qtavcore-supported-targets.yml
      - ffmpeg/**
      - modern/**
  pull_request:
    paths:
      - .github/workflows/qtavcore-supported-targets.yml
      - ffmpeg/**
      - modern/**

permissions:
  contents: read

concurrency:
  group: qtavcore-supported-targets-${{ github.ref }}
  cancel-in-progress: true

env:
  QTAV_VCPKG_REVISION: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  QTAV_ANDROID_NDK_VERSION: 29.0.14206865
  QTAV_ANDROID_CMAKE_VERSION: 4.1.2

jobs:
  windows:
    name: Windows x64 static/shared Release and CTest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/windows
    steps:
      - name: Check out the pinned source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize and verify pinned vcpkg
        shell: pwsh
        run: |
          git submodule update --init --depth 1 ffmpeg/vcpkg
          $actual = (git -C ffmpeg/vcpkg rev-parse HEAD).Trim()
          if ($actual -ne $env:QTAV_VCPKG_REVISION) {
            throw "Unexpected vcpkg revision: $actual"
          }

      - name: Restore the content-addressed vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: qtav-vcpkg-windows-${{ env.QTAV_VCPKG_REVISION }}-${{ hashFiles('ffmpeg/vcpkg.json', 'ffmpeg/ports/**', 'ffmpeg/triplets/**') }}

      - name: Prepare the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null

      - name: Build, test, install, and consume Windows packages
        shell: pwsh
        run: ./modern/scripts/ci/build-windows.ps1 -Parallel 8

      - name: Record hosted and device-test boundaries
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          Windows CI builds and runs static/shared Release CTest on the runner.
          Tests that return CTest skip code 77 remain skipped, not passed.
          Physical audio, native HDR/display, and vendor GPU qualification stay
          in the separately recorded device matrix.
          '@

      - name: Publish Windows test and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtavcore-windows-ci-logs
          path: |
            build/ci/windows/*/ctest-results.xml
            build/ci/windows/*/Testing/Temporary/*.log
            build/ci/windows/*/CMakeFiles/CMakeConfigureLog.yaml
            ffmpeg/build/x64-windows-static-md/vcpkg-work/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android arm64 API 28 static/shared packages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/android
    steps:
      - name: Check out the pinned source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize and verify pinned vcpkg
        shell: pwsh
        run: |
          git submodule update --init --depth 1 ffmpeg/vcpkg
          $actual = (git -C ffmpeg/vcpkg rev-parse HEAD).Trim()
          if ($actual -ne $env:QTAV_VCPKG_REVISION) {
            throw "Unexpected vcpkg revision: $actual"
          }

      - name: Locate or install pinned Android build tools
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) {
            $env:ANDROID_SDK_ROOT
          } elseif ($env:ANDROID_HOME) {
            $env:ANDROID_HOME
          } else {
            Join-Path $env:LOCALAPPDATA 'Android/Sdk'
          }
          $ndkRoot = Join-Path $sdkRoot "ndk/$env:QTAV_ANDROID_NDK_VERSION"
          $cmakeRoot = Join-Path $sdkRoot "cmake/$env:QTAV_ANDROID_CMAKE_VERSION"
          if (-not (Test-Path "$ndkRoot/build/cmake/android.toolchain.cmake") -or
              -not (Test-Path "$cmakeRoot/bin/cmake.exe")) {
            $sdkManager = Get-ChildItem -Path "$sdkRoot/cmdline-tools" `
              -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $sdkManager) {
              throw "Android sdkmanager.bat was not found under $sdkRoot"
            }
            $java = Get-Command java.exe -CommandType Application `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $java) {
              $javaHomes = @(
                (Join-Path ${env:ProgramFiles} 'Android/Android Studio/jbr')
                (Join-Path ${env:ProgramFiles} 'Huawei/DevEco Studio/jbr')
              )
              $javaHome = $javaHomes |
                Where-Object { Test-Path "$_/bin/java.exe" } |
                Select-Object -First 1
              if (-not $javaHome) {
                throw 'Java was not found on PATH or in Android Studio/DevEco.'
              }
              $env:JAVA_HOME = $javaHome
              $env:PATH = "$javaHome/bin;$env:PATH"
            }
            & $sdkManager --sdk_root=$sdkRoot `
              "ndk;$env:QTAV_ANDROID_NDK_VERSION" `
              "cmake;$env:QTAV_ANDROID_CMAKE_VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw 'Pinned Android tool installation failed.'
            }
          }
          "ANDROID_HOME=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndkRoot" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Restore the content-addressed vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: qtav-vcpkg-android28-${{ env.QTAV_ANDROID_NDK_VERSION }}-${{ env.QTAV_VCPKG_REVISION }}-${{ hashFiles('ffmpeg/vcpkg.json', 'ffmpeg/ports/**', 'ffmpeg/triplets/**') }}

      - name: Prepare the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null

      - name: Cross-build, install, and consume Android packages
        shell: pwsh
        run: ./modern/scripts/ci/build-android.ps1 -Parallel 8

      - name: Record cross-build and device-test boundaries
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          Android CI cross-compiles static/shared arm64/API 28 code, installs
          both packages, and links standalone consumers. It does not execute the
          ARM64 tests. APK installation, playback, HDR/compositor, physical
          audio, MediaCodec, and lifecycle checks remain device-only gates.
          '@

      - name: Publish Android failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtavcore-android-ci-failure-logs
          path: |
            build/ci/android/**/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/android/vcpkg-work/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 7

  ohos:
    name: OHOS arm64 API 23 static/shared packages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/ohos
    steps:
      - name: Check out the pinned source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize and verify pinned vcpkg
        shell: pwsh
        run: |
          git submodule update --init --depth 1 ffmpeg/vcpkg
          $actual = (git -C ffmpeg/vcpkg rev-parse HEAD).Trim()
          if ($actual -ne $env:QTAV_VCPKG_REVISION) {
            throw "Unexpected vcpkg revision: $actual"
          }

      - name: Restore the content-addressed vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: qtav-vcpkg-ohos23-${{ env.QTAV_VCPKG_REVISION }}-${{ hashFiles('ffmpeg/vcpkg.json', 'ffmpeg/ports/**', 'ffmpeg/triplets/**') }}

      - name: Prepare the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null

      - name: Cross-build, install, and consume OHOS packages
        shell: pwsh
        run: ./modern/scripts/ci/build-ohos.ps1 -Parallel 8

      - name: Record cross-build and device-test boundaries
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          OHOS CI cross-compiles static/shared arm64/API 23 code, installs both
          packages, and links standalone consumers. It does not execute the
          ARM64 tests or package/install a HAP. Signing, connected playback,
          native HDR/audio, OHCodec, and NativeBuffer checks remain device-only.
          '@

      - name: Publish OHOS failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtavcore-ohos-ci-failure-logs
          path: |
            build/ci/ohos/**/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/ohos/vcpkg-work/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 7
